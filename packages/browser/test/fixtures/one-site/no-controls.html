<!doctype html>
<html lang="en">
  <head>

    <title>About us - fixture landing page</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        height: 1000px;
        width: 100%;
        background: #ffffff;
        color: #111111;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      [id] {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        border: 0;
      }

  </head>
  <body>
    <h1 id="about-heading" style="left: 16px; top: 24px; width: 358px; height: 40px">About us</h1>
    <p id="about-body" style="left: 16px; top: 80px; width: 358px; height: 112px">
      A page with no control of any kind: no button, no link, no submit input and nothing with a
      button role. The stand-in selector found nothing here at all, and the screen was refused for
      the absence of a control nobody had declared.
    </p>
    <img
      id="about-photo"

      style="left: 16px; top: 216px; width: 200px; height: 120px"
    />

</html>
