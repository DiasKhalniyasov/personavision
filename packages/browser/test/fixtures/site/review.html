<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review your order - fixture shop</title>
    <link rel="stylesheet" href="fixture.css" />
  </head>
  <body class="page-review">
    <h1 id="review-heading" style="left: 16px; top: 16px; width: 358px; height: 40px">
      Review your order
    </h1>
    <p id="review-intro" style="left: 16px; top: 72px; width: 358px; height: 56px">
      The last step before the order is placed. Nothing is charged: placing this order loads the
      confirmation page of this site.
    </p>
    <img
      id="review-product-image"
      src="assets/tote.svg"
      alt="Canvas tote bag, natural"
      style="left: 16px; top: 144px; width: 120px; height: 120px"
    />
    <section
      id="review-summary"
      aria-label="Order summary"
      style="left: 16px; top: 288px; width: 358px; height: 200px"
    >
      <span id="review-total" style="left: 12px; top: 12px; width: 334px; height: 24px"
        >Total 48.00</span
      >
    </section>
    <a
      id="review-back"
      href="payment.html"
      style="left: 16px; top: 520px; width: 358px; height: 24px"
      >Back to payment</a
    >
    <a
      id="review-place-order"
      class="control-primary"
      href="confirmation.html"
      style="left: 16px; top: 600px; width: 358px; height: 44px"
      >Place order</a
    >
    <p id="review-footer-note" style="left: 16px; top: 1000px; width: 358px; height: 40px">
      Fixture site. Every id on this page is recorded in LANDMARKS.md beside it.
    </p>
  </body>
</html>
