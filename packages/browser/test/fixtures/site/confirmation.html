<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order confirmed - fixture shop</title>
    <link rel="stylesheet" href="fixture.css" />
  </head>
  <body class="page-confirmation">
    <h1 id="confirmation-heading" style="left: 16px; top: 16px; width: 358px; height: 40px">
      Order confirmed
    </h1>
    <p id="confirmation-intro" style="left: 16px; top: 72px; width: 358px; height: 56px">
      The task ends here. The control below returns to the first step, so a session can be driven
      around the four pages more than once.
    </p>
    <img
      id="confirmation-receipt-image"
      src="assets/receipt.svg"
      alt="A printed receipt"
      style="left: 16px; top: 144px; width: 120px; height: 120px"
    />
    <section
      id="confirmation-receipt"
      aria-label="Receipt"
      style="left: 16px; top: 288px; width: 358px; height: 160px"
    >
      <span id="confirmation-order-number" style="left: 12px; top: 12px; width: 334px; height: 24px"
        >Order FIX-1001</span
      >
    </section>
    <a
      id="confirmation-continue-shopping"
      class="control-primary"
      href="cart.html"
      style="left: 16px; top: 480px; width: 358px; height: 44px"
      >Continue shopping</a
    >
    <p id="confirmation-footer-note" style="left: 16px; top: 940px; width: 358px; height: 40px">
      Fixture site. Every id on this page is recorded in LANDMARKS.md beside it.
    </p>
  </body>
</html>
