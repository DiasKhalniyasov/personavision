<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your cart - fixture shop</title>
    <link rel="stylesheet" href="fixture.css" />
  </head>
  <body class="page-cart">
    <div
      id="cart-banner"
      class="region-banner"
      style="left: 16px; top: 16px; width: 358px; height: 48px"
    ></div>
    <h1 id="cart-heading" style="left: 16px; top: 80px; width: 358px; height: 40px">Your cart</h1>
    <p id="cart-intro" style="left: 16px; top: 128px; width: 358px; height: 56px">
      Two items are in this cart. Nothing here is a real shop: these pages exist so that the browser
      module can be driven with no network.
    </p>
    <img
      id="cart-product-image"
      src="assets/tote.svg"
      alt="Canvas tote bag, natural"
      style="left: 16px; top: 200px; width: 120px; height: 120px"
    />
    <section
      id="cart-items"
      aria-label="Cart items"
      style="left: 16px; top: 336px; width: 358px; height: 240px"
    >
      <span id="cart-item-tote-name" style="left: 12px; top: 12px; width: 240px; height: 20px"
        >Canvas tote bag</span
      >
      <button
        id="cart-remove-tote"
        type="button"
        style="left: 12px; top: 40px; width: 120px; height: 32px"
      >
        Remove
      </button>
      <button
        id="cart-save-tote"
        type="button"
        aria-label="Save the canvas tote for later"
        style="left: 140px; top: 40px; width: 206px; height: 32px"
      >
        Save
      </button>
      <span id="cart-item-mug-name" style="left: 12px; top: 96px; width: 240px; height: 20px"
        >Enamel mug</span
      >
      <button
        id="cart-remove-mug"
        type="button"
        style="left: 12px; top: 124px; width: 120px; height: 32px"
      >
        Remove
      </button>
    </section>
    <div
      id="cart-upsell-card"
      class="region-card"
      style="left: 16px; top: 600px; width: 358px; height: 160px"
    ></div>
    <a
      id="cart-checkout"
      class="control-primary"
      href="payment.html"
      style="left: 16px; top: 784px; width: 358px; height: 44px"
      >Checkout</a
    >
    <button
      id="cart-promo-apply"
      type="button"
      style="left: 16px; top: 862px; width: 358px; height: 28px"
    >
      Apply a promo code
    </button>
    <p id="cart-footer-note" style="left: 16px; top: 1200px; width: 358px; height: 40px">
      Fixture site. Every id on this page is recorded in LANDMARKS.md beside it.
    </p>
  </body>
</html>
