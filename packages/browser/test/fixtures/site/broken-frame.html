  <body class="page-broken-frame">

    </p>

      id="broken-frame-stalled"
      class="frame"
      src="/slow"
      title="Card details, served by a route that never answers"
      style="left: 16px; top: 144px; width: 358px; height: 200px"
    ></iframe>
    <iframe
      id="broken-frame-unresolvable"
      class="frame"
      src="http://frame.invalid/card.html"
      title="Card details, served by a host that cannot resolve"
      style="left: 16px; top: 368px; width: 358px; height: 200px"
    ></iframe>
    <button
      id="broken-frame-submit"
      type="button"
      style="left: 16px; top: 600px; width: 358px; height: 44px"
    >
      Pay now
    </button>
