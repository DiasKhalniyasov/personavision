name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · lint · test · build · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright's Chromium is the one install-time network dependency in this project,
      # and it is deliberately not a `postinstall`: `pnpm install` never reaches for a
      # browser, so the workspace installs the same way with or without one. The cache is
      # keyed on the Playwright version, so a run downloads a browser only when that
      # version moves. `packages/browser/README.md` states the same command a fresh clone
      # runs.
      - id: playwright-version
        run: |
          version="$(pnpm --filter @personavision/browser exec playwright --version | awk '{ print $NF }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @personavision/browser exec playwright install --with-deps chromium

      # A cached browser is the binary only; the system libraries it links against are not
      # in the cache and are reinstalled on every run.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @personavision/browser exec playwright install-deps chromium

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # The committed example run, held to the schemas: a change that leaves the fixture
      # behind fails the build here rather than breaking the demo.
      - run: pnpm validate:example-run

      # The calibration gate (#89): the engine's human-likeness figures held to the floors
      # the last recorded measurement put them at, and the committed report held to a fresh
      # scoring run — so a figure in this repository is always the figure the code produces
      # and the engine cannot get less human-like without a diff saying so.
      #
      # Its own step because its failure is its own: a red gate means the engine changed, not
      # that a test broke. It needs no network, no API key and no dataset download — the
      # corpus is committed (#82) and the segmenter is offline.
      #
      # Measured on this runner: **two seconds** for both commands, against about 34 ms of
      # actual scoring (`SCORING_BUDGET`) — the rest is Node and `sharp` starting twice. The
      # budget below is a hundred and fifty times that, loose on purpose, because a tighter
      # one would be a bound on a shared runner's load rather than on this gate.
      - name: calibration gate
        timeout-minutes: 5
        run: |
          pnpm --filter @personavision/calibration run gate
          pnpm --filter @personavision/calibration run report --check

  # The project's gate (#79): the whole pipeline regenerated from scratch over the demo shop
  # and held to `docs/FLOW.md` section 5's table, to the completion figures the product leads
  # with, to determinism, and to planted-defect precision and recall against
  # `demo/northwind/defects.json`. A regression in any subsystem — browser, attention, swarm,
  # scoring — fails here even when every unit test passes, and a red gate fails the build.
  #
  # Its own job, after `check`, because it is slow and because its failure is its own: three
  # browser runs of about twenty seconds each, which is why `pnpm test` does not run it. The
  # tag `pnpm test:acceptance` sets is what turns it on.
  #
  # It needs no credential and no network beyond the package registry and the loopback port
  # the demo shop binds: no secret is passed to this job, the run it regenerates is offline
  # and names no model, and `tests/workspace.test.ts` is what holds the whole tree to reading
  # a credential nowhere but in `packages/provider`. It writes nothing into
  # `runs/2026-10-24-1402-northwind-demo/` — every regeneration goes to a temporary directory
  # and the committed one's contents are compared before and after.
  acceptance:
    name: acceptance gate
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: |
          version="$(pnpm --filter @personavision/browser exec playwright --version | awk '{ print $NF }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @personavision/browser exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @personavision/browser exec playwright install-deps chromium

      # After the build, as the ticket asks, so that a package which typechecks but does not
      # build fails before the gate rather than inside it.
      #
      # It is worth being exact about what this does not cover. Vitest resolves the
      # workspace's `development` export condition, so the suite drives `packages/*/src`
      # and not `dist`: a regression that only shows up in the built output — the
      # `keepNames` hazard `scripts/generate-demo-run.ts` describes is one — would pass here
      # and fail `pnpm demo:run`. The committed artifact is produced by that command, and
      # `tests/cold-start.test.ts` is what drives the built CLI.
      - run: pnpm build

      - run: pnpm test:acceptance
