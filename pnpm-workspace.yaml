packages:
  - packages/*
  - apps/*
  # The demo shop is a workspace project so that `pnpm -r build` type-checks its server.
  - demo/*

# pnpm 10 does not run dependency build scripts unless they are named here.
# esbuild (used by vitest and tsx) needs its postinstall to place its binary.
onlyBuiltDependencies:
  - esbuild
